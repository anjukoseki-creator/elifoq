<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Elifoq — 日常の「なぜ？」を思考力に変える</title>
<style>
  :root{ --primary:#2E6DB4; --primary-d:#1F4E84; --bg:#F6F8FB; --card:#fff;
    --text:#1F2430; --sub:#667085; --border:#E3E8EF; --good:#2E9E5B; --warn:#C77700; --danger:#B00020; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    background:var(--bg); color:var(--text); }
  .app{ max-width:480px; margin:0 auto; min-height:100vh; background:var(--bg);
    display:flex; flex-direction:column; box-shadow:0 0 40px rgba(0,0,0,.05); }
  header{ background:var(--primary); color:#fff; padding:14px 16px; display:flex;
    align-items:center; justify-content:space-between; position:sticky; top:0; z-index:5; }
  header .brand{ font-weight:800; font-size:20px; letter-spacing:.5px; }
  header .tag{ font-size:11px; opacity:.85; margin-left:8px; font-weight:400; }
  header button{ background:rgba(255,255,255,.18); color:#fff; border:none; border-radius:8px;
    padding:7px 10px; font-size:13px; cursor:pointer; }
  main{ flex:1; padding:16px; overflow-y:auto; }
  .sub{ color:var(--sub); font-size:13px; line-height:1.6; }
  h2{ font-size:20px; margin:0 0 4px; }
  .chips{ display:flex; gap:8px; overflow-x:auto; padding:12px 0; }
  .chip{ white-space:nowrap; padding:8px 14px; border-radius:999px; background:#fff;
    border:1px solid var(--border); color:var(--sub); font-weight:600; cursor:pointer; font-size:13px; }
  .chip.active{ background:var(--primary); border-color:var(--primary); color:#fff; }
  .card{ background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px;
    margin-bottom:12px; box-shadow:0 2px 8px rgba(0,0,0,.03); }
  .qcard{ cursor:pointer; transition:transform .05s; }
  .qcard:active{ transform:scale(.99); }
  .qcard .body{ font-size:16px; line-height:1.5; }
  .qcard .meta{ color:var(--sub); font-size:12px; margin-top:8px; }
  .genre-label{ color:var(--primary); font-weight:700; font-size:13px; margin-bottom:6px; }
  .q-big{ font-size:19px; line-height:1.5; margin:0; }
  textarea{ width:100%; min-height:120px; border:1px solid var(--border); border-radius:12px;
    padding:14px; font-size:16px; font-family:inherit; resize:vertical; margin-top:8px; color:var(--text); }
  textarea.short{ min-height:80px; }
  label{ font-weight:700; display:block; margin-top:18px; }
  .btn{ width:100%; background:var(--primary); color:#fff; border:none; border-radius:12px;
    padding:15px; font-size:16px; font-weight:700; cursor:pointer; margin-top:16px; }
  .btn:disabled{ background:#A9C4E2; cursor:not-allowed; }
  .btn.ghost{ background:#fff; color:var(--primary); border:1px solid var(--primary); }
  .block-title{ font-weight:700; margin:0 0 6px; font-size:15px; }
  .pname{ font-weight:700; }
  .phint{ color:var(--sub); margin-top:4px; line-height:1.5; }
  input[type=password],input[type=text]{ width:100%; border:1px solid var(--border); border-radius:10px;
    padding:13px; font-size:15px; margin-top:12px; font-family:inherit; }
  a{ color:var(--primary); }
  .tabbar{ display:flex; border-top:1px solid var(--border); background:#fff; position:sticky; bottom:0; }
  .tabbar button{ flex:1; background:none; border:none; padding:11px 0 14px; cursor:pointer;
    color:var(--sub); font-size:11px; }
  .tabbar button.active{ color:var(--primary); font-weight:700; }
  .tabbar .ic{ font-size:20px; display:block; }
  .spinner{ width:38px; height:38px; border:4px solid #d9e4f2; border-top-color:var(--primary);
    border-radius:50%; animation:spin 1s linear infinite; margin:40px auto 14px; }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  .center{ text-align:center; color:var(--sub); }
  .err{ color:var(--danger); text-align:center; line-height:1.6; }
  .empty{ text-align:center; color:var(--sub); margin-top:60px; line-height:1.7; }
  .pill{ display:inline-block; background:#EAF1FA; color:var(--primary); border-radius:999px;
    padding:3px 10px; font-size:12px; font-weight:700; }
  .banner{ background:#FFF6E5; border:1px solid #F2D99B; border-radius:12px; padding:13px 14px;
    margin-bottom:14px; font-size:13px; line-height:1.6; color:#7a5b13; cursor:pointer; }
  ol.guide{ margin:10px 0 4px; padding-left:20px; }
  ol.guide li{ margin-bottom:8px; line-height:1.6; }
  .step{ display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px;
    border-radius:50%; background:var(--primary); color:#fff; font-size:13px; font-weight:700; margin-right:8px; }
  code{ background:#EEF2F7; padding:1px 6px; border-radius:5px; font-size:13px; }
  .saved-msg{ margin-top:10px; color:var(--good); font-weight:600; min-height:18px; }
  .score-big{ text-align:center; }
  .score-big .num{ font-size:46px; font-weight:800; color:var(--primary); line-height:1; }
  .score-big .num small{ font-size:20px; color:var(--sub); font-weight:700; }
  .score-big .cmt{ color:var(--text); margin-top:8px; line-height:1.6; font-size:14px; }
  .dim{ margin-bottom:13px; }
  .dim-top{ display:flex; justify-content:space-between; font-size:13px; font-weight:700; }
  .dim-top b{ color:var(--primary); }
  .bar{ height:8px; background:#EAEFF5; border-radius:6px; margin:5px 0; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--primary); border-radius:6px; }
  .dim-c{ font-size:12px; color:var(--sub); line-height:1.5; }
  .histcard{ cursor:pointer; }
  .backlink{ color:var(--primary); font-weight:600; cursor:pointer; display:inline-block; margin-bottom:8px; font-size:14px; }
  .ftag{ display:inline-block; background:#EFE7FB; color:#6B3FA0; border-radius:999px; padding:2px 9px; font-size:11px; font-weight:700; margin-bottom:6px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div><span class="brand">Elifoq</span><span class="tag">日常の「なぜ？」を思考力に</span></div>
    <button onclick="go('settings')">⚙ 設定</button>
  </header>
  <main id="main"></main>
  <nav class="tabbar" id="tabbar"></nav>
</div>

<script>
const QUESTIONS = [
  // マーケティング
  {id:'mkt-01',genre:'マーケティング',d:2,body:'なぜ綾鷹はコカ・コーラのロゴを前面に出さないのか？'},
  {id:'mkt-02',genre:'マーケティング',d:1,body:'なぜスターバックスは大きな看板で安さを訴求しないのか？'},
  {id:'mkt-03',genre:'マーケティング',d:2,body:'なぜ多くのサービスはサブスク（月額課金）に移行したのか？'},
  {id:'mkt-04',genre:'マーケティング',d:2,body:'なぜコンビニのコーヒーは100円台で出せるのか？'},
  {id:'mkt-05',genre:'マーケティング',d:2,body:'なぜ高級ブランドはセールをほとんどしないのか？'},
  {id:'mkt-06',genre:'マーケティング',d:1,body:'なぜ多くのアプリは最初を「無料」にするのか？'},
  {id:'mkt-07',genre:'マーケティング',d:1,body:'なぜ「期間限定」は人を動かすのか？'},
  {id:'mkt-08',genre:'マーケティング',d:3,body:'なぜ商品は松・竹・梅の3段階で売られることが多いのか？'},
  // IT・SIer
  {id:'it-01',genre:'IT・SIer',d:3,body:'なぜ銀行の基幹システムは古いまま使われ続けるのか？'},
  {id:'it-02',genre:'IT・SIer',d:2,body:'なぜ多くの企業のDXは失敗するのか？'},
  {id:'it-03',genre:'IT・SIer',d:1,body:'なぜ大学の履修登録システムはアクセスが集中すると落ちるのか？'},
  {id:'it-04',genre:'IT・SIer',d:2,body:'なぜソフトウェアの納期は遅れがちなのか？'},
  {id:'it-05',genre:'IT・SIer',d:2,body:'なぜ日本ではいまだにFAXが使われ続けるのか？'},
  {id:'it-06',genre:'IT・SIer',d:3,body:'なぜ大規模システム開発は炎上しやすいのか？'},
  {id:'it-07',genre:'IT・SIer',d:2,body:'なぜパスワードの定期変更は推奨されなくなったのか？'},
  {id:'it-08',genre:'IT・SIer',d:3,body:'なぜクラウド移行が必ずしもコスト削減につながらないのか？'},
  // 経営
  {id:'mgt-01',genre:'経営',d:2,body:'なぜ映画館はチケットよりポップコーンで稼ぐ構造なのか？'},
  {id:'mgt-02',genre:'経営',d:2,body:'なぜユニクロは企画から販売まで自社で一貫して行うのか？'},
  {id:'mgt-03',genre:'経営',d:2,body:'なぜテーマパークの入場料は年々上がるのか？'},
  {id:'mgt-04',genre:'経営',d:2,body:'なぜ飲食チェーンは郊外のロードサイドに多く出店するのか？'},
  {id:'mgt-05',genre:'経営',d:3,body:'なぜ老舗企業ほど新規事業に苦戦しやすいのか？'},
  {id:'mgt-06',genre:'経営',d:2,body:'なぜ航空券は同じ便でも人によって値段が違うのか？'},
  {id:'mgt-07',genre:'経営',d:2,body:'なぜ100円ショップは利益を出せるのか？'},
  {id:'mgt-08',genre:'経営',d:2,body:'なぜ多くの企業は値上げではなく内容量を減らすのか？'},
  // 心理学
  {id:'psy-01',genre:'心理学',d:1,body:'なぜ人は行列ができている店に並びたくなるのか？'},
  {id:'psy-02',genre:'心理学',d:2,body:'なぜ星の数のレビューは購買行動を大きく左右するのか？'},
  {id:'psy-03',genre:'心理学',d:1,body:'なぜ人は「残りわずか」に弱いのか？'},
  {id:'psy-04',genre:'心理学',d:2,body:'なぜ「無料」という言葉に人は引き寄せられるのか？'},
  {id:'psy-05',genre:'心理学',d:2,body:'なぜSNSは時間を忘れて見続けてしまうのか？'},
  {id:'psy-06',genre:'心理学',d:2,body:'なぜ最初に見た価格を基準にしてしまうのか？'},
  {id:'psy-07',genre:'心理学',d:2,body:'なぜ選択肢が多すぎると逆に選べなくなるのか？'},
  {id:'psy-08',genre:'心理学',d:3,body:'なぜ人は自分の選択を後から正当化してしまうのか？'},
  // 社会
  {id:'soc-01',genre:'社会',d:3,body:'なぜ少子化は対策をしても止まりにくいのか？'},
  {id:'soc-02',genre:'社会',d:2,body:'なぜ満員電車はなくならないのか？'},
  {id:'soc-03',genre:'社会',d:2,body:'なぜ地方の商店街はシャッター街になりやすいのか？'},
  {id:'soc-04',genre:'社会',d:2,body:'なぜ日本では現金がいまだに根強く使われるのか？'},
  {id:'soc-05',genre:'社会',d:2,body:'なぜ都市部の家賃は下がりにくいのか？'},
  {id:'soc-06',genre:'社会',d:2,body:'なぜリモートワークは完全には定着しなかったのか？'},
  {id:'soc-07',genre:'社会',d:2,body:'なぜ高齢化が進むと社会保障費が膨らむのか？'},
  {id:'soc-08',genre:'社会',d:2,body:'なぜ行政の手続きはいまだに紙が多いのか？'},
  // 身近な謎
  {id:'mys-01',genre:'身近な謎',d:1,body:'なぜ信号機は赤・黄・青の3色なのか？'},
  {id:'mys-02',genre:'身近な謎',d:1,body:'なぜ自動販売機は日本の路上にこれほど多いのか？'},
  {id:'mys-03',genre:'身近な謎',d:1,body:'なぜコンビニはどこも似たレイアウトなのか？'},
  {id:'mys-04',genre:'身近な謎',d:2,body:'なぜスーパーは入口付近に野菜売り場があるのか？'},
  {id:'mys-05',genre:'身近な謎',d:1,body:'なぜ横断歩道は白い縞模様なのか？'},
  {id:'mys-06',genre:'身近な謎',d:2,body:'なぜ多くのエレベーターには鏡があるのか？'},
  {id:'mys-07',genre:'身近な謎',d:1,body:'なぜ書店では本にカバーを掛けてくれるのか？'},
  {id:'mys-08',genre:'身近な謎',d:2,body:'なぜ食品サンプルは日本でこれほど発達したのか？'},
];
const GENRES = ['マーケティング','IT・SIer','経営','心理学','社会','身近な謎'];
const PERSPECTIVES = ['マーケティング','顧客','技術','法規制','コスト','心理','競争戦略','社会'];
const DIMENSIONS = [
  ['問題定義力','何が本当に問うべき論点かを捉えられているか'],
  ['論理性','主張と根拠の筋が通り、因果関係が明確か'],
  ['多角性','一つの視点に偏らず複数の切り口から考えているか'],
  ['具体性','抽象論で終わらず具体例やメカニズムに踏み込めているか'],
  ['問題分解力','要素に分けて整理（MECE）できているか'],
  ['仮説を立てる力','「たぶんこうだ」と仮説を立てて検証する姿勢があるか'],
  ['数字感覚','規模感や定量的な視点を持てているか'],
  ['創造力','ありきたりでない独自の発想があるか'],
];

const LS_KEY='elifoq.key', LS_HIST='elifoq.history';
const getKey=()=>localStorage.getItem(LS_KEY)||'';
const setKey=v=>localStorage.setItem(LS_KEY,v);
const getHist=()=>{ try{ return JSON.parse(localStorage.getItem(LS_HIST)||'[]'); }catch{ return []; } };
const pushHist=e=>{ const h=getHist(); h.unshift(e); localStorage.setItem(LS_HIST,JSON.stringify(h.slice(0,200))); };

let state={ screen:'home', genre:GENRES[0], qid:null, answer:'', current:null, histId:null };
const main=document.getElementById('main');
const esc=s=>(s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function go(screen,extra={}){ state={...state,screen,...extra}; render(); window.scrollTo(0,0); main.scrollTop=0; }

function render(){
  renderTabbar();
  if(state.screen==='home') return renderHome();
  if(state.screen==='answer') return renderAnswer();
  if(state.screen==='feedback') return showFeedback();
  if(state.screen==='history') return renderHistory();
  if(state.screen==='histdetail') return renderHistoryDetail();
  if(state.screen==='settings') return renderSettings();
}

function renderTabbar(){
  const tabs=[['home','🏠','ホーム'],['history','📜','履歴'],['settings','⚙️','設定']];
  const homeActive=['home','answer','feedback'].includes(state.screen);
  const histActive=['history','histdetail'].includes(state.screen);
  document.getElementById('tabbar').innerHTML=tabs.map(([s,ic,l])=>{
    const act=(s==='home'&&homeActive)||(s==='history'&&histActive)||s===state.screen;
    return `<button class="${act?'active':''}" onclick="go('${s}')"><span class="ic">${ic}</span>${l}</button>`;
  }).join('');
}

function renderHome(){
  const qs=QUESTIONS.filter(q=>q.genre===state.genre);
  const banner = getKey() ? '' :
    `<div class="banner" onclick="go('settings')">🔑 <b>はじめに：</b>AIフィードバックを使うには、無料のGemini APIキーが必要です。タップして<u>設定で登録</u>しましょう（手順を案内します）。</div>`;
  main.innerHTML=`
    ${banner}
    <h2>今日も、なぜ？を考えよう</h2>
    <p class="sub">ジャンルを選んで、好きな問題に挑戦できます。正解はありません。</p>
    <div class="chips">${GENRES.map(g=>`<div class="chip ${g===state.genre?'active':''}" onclick="go('home',{genre:'${g}'})">${g}</div>`).join('')}</div>
    ${qs.map(q=>`<div class="card qcard" onclick="go('answer',{qid:'${q.id}',answer:''})">
        <div class="body">${esc(q.body)}</div>
        <div class="meta">難易度 ${'★'.repeat(q.d)}</div></div>`).join('')}
  `;
}

function renderAnswer(){
  const q=QUESTIONS.find(x=>x.id===state.qid);
  main.innerHTML=`
    <div class="card"><div class="genre-label">${q.genre}</div><p class="q-big">${esc(q.body)}</p></div>
    <label>あなたの考え</label>
    <textarea id="ans" placeholder="まずは自分なりの仮説を書いてみよう">${esc(state.answer)}</textarea>
    <p class="sub">目安: 30〜120字。短くてもOK。</p>
    <button class="btn" id="submit" disabled onclick="submitAnswer()">AIに採点＆視点を広げてもらう</button>
  `;
  const ta=document.getElementById('ans'), btn=document.getElementById('submit');
  const upd=()=>{ state.answer=ta.value; btn.disabled=ta.value.trim().length<5; };
  ta.addEventListener('input',upd); upd();
}

function spinner(msg){ main.innerHTML=`<div class="spinner"></div><p class="center">${esc(msg)}</p>`; }

async function submitAnswer(){
  const q=QUESTIONS.find(x=>x.id===state.qid);
  go('feedback'); spinner('AIが採点して視点を広げています…');
  const key=getKey();
  if(!key){ main.innerHTML=`<p class="err">Gemini APIキーが未設定です。<br>「設定」から登録してください（手順を案内しています）。</p>
    <button class="btn ghost" onclick="go('settings')">設定を開く</button>`; return; }
  try{
    const fb=await callGemini(key,{question:q.body,genre:q.genre,answer:state.answer,prior:null});
    state.current={genre:q.genre,question:q.body,answer:state.answer,fb};
    saveRound('main');
    showFeedback();
  }catch(e){ main.innerHTML=`<p class="err">${esc(e.message)}</p>
    <button class="btn ghost" onclick="go('home')">ホームに戻る</button>`; }
}

async function submitFollowup(){
  const cur=state.current; const ta=document.getElementById('fans'); const ans=ta.value.trim();
  if(ans.length<5) return;
  const fq=cur.fb.follow_up_question;
  go('feedback'); spinner('発展回答を採点しています…');
  const key=getKey();
  try{
    const prior=`【背景】元の問題: ${cur.question}\nそれに対するあなたの回答: ${cur.answer}\n（以下は、その発展質問「${fq}」へのあなたの回答です。発展質問に答えられているかも踏まえて評価してください）`;
    const fb=await callGemini(key,{question:fq,genre:cur.genre,answer:ans,prior});
    state.current={genre:cur.genre,question:fq,answer:ans,fb};
    saveRound('followup');
    showFeedback();
  }catch(e){ main.innerHTML=`<p class="err">${esc(e.message)}</p>
    <button class="btn ghost" onclick="go('home')">ホームに戻る</button>`; }
}

function saveRound(kind){
  const c=state.current;
  pushHist({ id:'h-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),
    kind, genre:c.genre, question:c.question, answer:c.answer, fb:c.fb, at:Date.now() });
}

function scoreBar(name,score,comment){
  const s=Math.max(0,Math.min(10,Number(score)||0));
  return `<div class="dim"><div class="dim-top"><span>${esc(name)}</span><b>${s}/10</b></div>
    <div class="bar"><div class="bar-fill" style="width:${s*10}%"></div></div>
    ${comment?`<div class="dim-c">${esc(comment)}</div>`:''}</div>`;
}

function feedbackHTML(c, withFollowup){
  const fb=c.fb;
  const scores=(fb.scores||[]).map(s=>scoreBar(s.name,s.score,s.comment)).join('');
  const persp=(fb.other_perspectives||[]).map(p=>
    `<div class="card"><div class="pname">${esc(p.name)}</div><div class="phint">${esc(p.hint)}</div></div>`).join('');
  const fu = withFollowup ? `
    <div class="card">
      <p class="block-title" style="color:var(--primary)">❓ 発展質問</p>
      <div>${esc(fb.follow_up_question)}</div>
      <textarea id="fans" class="short" placeholder="この問いにも答えてみよう（連続で深められます）"></textarea>
      <button class="btn" id="fbtn" disabled onclick="submitFollowup()">この質問に答えて、さらに深める</button>
    </div>
    <button class="btn ghost" onclick="go('home')">別の問題に挑戦する</button>
  ` : `
    <div class="card"><p class="block-title" style="color:var(--primary)">❓ 発展質問</p><div>${esc(fb.follow_up_question)}</div></div>
  `;
  return `
    <div class="card score-big">
      <div class="num">${esc(fb.overall_score)}<small> / 10</small></div>
      <div class="cmt">${esc(fb.overall_comment)}</div>
    </div>
    <div class="card">
      <p class="block-title">📊 項目別の評価（思考の質）</p>
      ${scores}
    </div>
    <div class="card"><p class="block-title" style="color:var(--good)">👍 良い点</p><div>${esc(fb.good_point)}</div></div>
    <div class="card"><p class="block-title" style="color:var(--warn)">🔍 見落としやすい点</p><div>${esc(fb.blind_spot)}</div></div>
    <h2 style="font-size:16px;margin:8px 0">🧭 別の視点も考えてみよう</h2>
    ${persp}
    <div class="card"><p class="block-title" style="color:var(--primary-d)">📝 模範回答例</p><div style="line-height:1.7">${esc(fb.model_answer)}</div></div>
    ${fu}
  `;
}

function showFeedback(){
  const c=state.current;
  main.innerHTML=`
    <div class="card"><div class="genre-label">${esc(c.genre)}</div>
      <p class="q-big" style="font-size:16px">${esc(c.question)}</p>
      <p class="sub" style="margin-top:8px">あなたの回答: ${esc(c.answer)}</p></div>
    ${feedbackHTML(c,true)}
  `;
  wireFollowup();
}

function wireFollowup(){
  const ta=document.getElementById('fans'), btn=document.getElementById('fbtn');
  if(!ta||!btn) return;
  const upd=()=>{ btn.disabled=ta.value.trim().length<5; };
  ta.addEventListener('input',upd); upd();
}

async function callGemini(key,p){
  const sys=[
    'あなたは思考力を鍛えるコーチ兼、ケース面接の評価者です。',
    '目的は「正解を当てさせること」ではなく、回答者の思考の質を評価し、考え方の幅を広げることです。',
    '次の8つの観点それぞれを0〜10点で採点し、短い講評を付けてください（厳しすぎず、根拠を示して建設的に）:',
    DIMENSIONS.map(d=>`- ${d[0]}: ${d[1]}`).join('\n'),
    'overall_score は総合点(0〜10の整数)。良い点→見落とし→別の視点(2〜4個)→模範回答例→発展質問、の順で内容も返します。',
    'model_answer には、その問題に対する筋の良い回答例を3〜5文で具体的に示してください。',
    'follow_up_question は、回答者の思考をさらに一段深めるための問いを1つ。',
    '全体に日本語・敬体で簡潔に。出力は指定JSONのみ。',
  ].join('\n');
  const dimEnum=DIMENSIONS.map(d=>d[0]);
  const schema={ type:'object', properties:{
    overall_score:{type:'integer'},
    overall_comment:{type:'string'},
    scores:{type:'array',items:{type:'object',properties:{
      name:{type:'string',enum:dimEnum}, score:{type:'integer'}, comment:{type:'string'}
    },required:['name','score','comment']}},
    good_point:{type:'string'}, blind_spot:{type:'string'},
    other_perspectives:{type:'array',items:{type:'object',properties:{name:{type:'string'},hint:{type:'string'}},required:['name','hint']}},
    model_answer:{type:'string'},
    follow_up_question:{type:'string'} },
    required:['overall_score','overall_comment','scores','good_point','blind_spot','other_perspectives','model_answer','follow_up_question'] };
  const userText=(p.prior?p.prior+'\n':'')+`問題: ${p.question}\nジャンル: ${p.genre}\nユーザーの回答: ${p.answer}`;
  const url='https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent';
  const res=await fetch(url,{ method:'POST',
    headers:{'Content-Type':'application/json','x-goog-api-key':key},
    body:JSON.stringify({
      systemInstruction:{parts:[{text:sys}]},
      contents:[{role:'user',parts:[{text:userText}]}],
      generationConfig:{temperature:0.6,responseMimeType:'application/json',responseSchema:schema}
    })});
  if(!res.ok){
    if(res.status===400||res.status===401||res.status===403) throw new Error('APIキーが無効か権限がありません。設定でキーを確認してください。');
    if(res.status===429) throw new Error('無料枠のレート制限に達しました。少し待って再試行してください。');
    throw new Error('Geminiの呼び出しに失敗しました ('+res.status+')。');
  }
  const data=await res.json();
  const text=data?.candidates?.[0]?.content?.parts?.[0]?.text;
  if(!text) throw new Error('応答が空でした。もう一度お試しください。');
  return JSON.parse(text);
}

function renderHistory(){
  const h=getHist();
  if(!h.length){ main.innerHTML=`<p class="empty">まだ回答がありません。<br>ホームから問題に挑戦してみましょう。</p>`; return; }
  main.innerHTML=`<h2>思考履歴</h2><p class="sub">タップすると採点・フィードバックを全部見られます。</p>`+
    h.map(e=>`<div class="card histcard" onclick="go('histdetail',{histId:'${e.id}'})">
      ${e.kind==='followup'?'<span class="ftag">↳ 発展質問</span><br>':''}
      <span class="pill">${esc(e.genre)}・${new Date(e.at).toLocaleDateString('ja-JP')}・${esc(e.fb.overall_score)}/10</span>
      <div style="font-weight:600;margin:6px 0;line-height:1.4">${esc(e.question)}</div>
      <div class="sub">あなた: ${esc(e.answer)}</div>
    </div>`).join('');
}

function renderHistoryDetail(){
  const e=getHist().find(x=>x.id===state.histId);
  if(!e){ go('history'); return; }
  main.innerHTML=`
    <span class="backlink" onclick="go('history')">← 履歴に戻る</span>
    <div class="card"><div class="genre-label">${esc(e.genre)}・${new Date(e.at).toLocaleString('ja-JP')}</div>
      ${e.kind==='followup'?'<span class="ftag">↳ 発展質問への回答</span>':''}
      <p class="q-big" style="font-size:16px">${esc(e.question)}</p>
      <p class="sub" style="margin-top:8px">あなたの回答: ${esc(e.answer)}</p></div>
    ${feedbackHTML({genre:e.genre,question:e.question,answer:e.answer,fb:e.fb}, false)}
    <button class="btn ghost" onclick="go('history')">履歴に戻る</button>
  `;
}

function renderSettings(){
  const has=!!getKey();
  main.innerHTML=`
    <h2>設定</h2>
    <div class="card">
      <p class="block-title"><span class="step">1</span>Gemini APIキーを取得（無料）</p>
      <p class="sub">「自分専用のAIの鍵」を無料でもらう手順です。1〜2分で終わります。</p>
      <ol class="guide">
        <li><a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">Google AI Studio のキー作成ページ</a>を開く</li>
        <li>Googleアカウントでログイン（普段のGmailでOK）</li>
        <li>青いボタン「<b>Create API key / APIキーを作成</b>」を押す</li>
        <li>表示された文字列（<code>AIza…</code> または <code>AQ…</code> で始まる）を<b>コピー</b></li>
      </ol>
      <p class="sub">クレジットカードは不要。Flash系モデルは無料枠で使えます。</p>
    </div>
    <div class="card">
      <p class="block-title"><span class="step">2</span>コピーしたキーを貼り付けて保存</p>
      <input type="password" id="key" placeholder="ここに長い文字列を貼り付け" value="${esc(getKey())}" />
      <button class="btn" onclick="saveKeyUI()">${has?'保存済み（更新する）':'保存する'}</button>
      ${has?`<button class="btn ghost" onclick="clearKeyUI()" style="margin-top:8px">キーを削除</button>`:''}
      <p class="saved-msg" id="saved">${has?'登録済みです ✓ ホームから問題に挑戦できます。':''}</p>
      <p class="sub">キーはこのブラウザの中だけに保存され、外部のサーバーには一切送られません。スマホを変えたら再登録が必要です。</p>
    </div>
    <p class="sub center" style="margin-top:18px">Elifoq — Everyday Life Is Full Of Questions</p>
  `;
}
function saveKeyUI(){ const v=document.getElementById('key').value.trim();
  const msg=document.getElementById('saved');
  if(v.length<15){ msg.style.color='var(--danger)'; msg.textContent='キーが短いようです。全部コピーできているか確認してください。'; return; }
  setKey(v); msg.style.color='var(--good)'; msg.textContent='保存しました ✓ ホームから問題に挑戦できます。'; }
function clearKeyUI(){ localStorage.removeItem(LS_KEY); renderSettings(); }

render();
</script>
